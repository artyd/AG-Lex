# AG Lex edge gateway — host-facing nginx that fronts both the SPA and the
# FastAPI backend on a single port (8002, mapped in docker-compose.yml).
#
# Routing:
#   /api/  → backend (FastAPI, includes /api/health for the deploy probe)
#   /ws    → backend WebSocket (realtime fan-out, Phase 2.4)
#   /mcp, /authorize, /token, /register, /revoke, /oauth/, /.well-known/oauth-*
#          → backend (MCP server + OAuth, docs/mcp/DESIGN.md)
#   /      → frontend (Vite build served by the frontend container)

# Per-IP throttle for the unauthenticated OAuth endpoints (login brute force,
# dynamic-registration spam). conf.d files are included in the http block.
limit_req_zone $binary_remote_addr zone=aglex_oauth:10m rate=20r/m;

upstream aglex_backend {
    server backend:8000;
}

upstream aglex_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Match the backend's MAX_UPLOAD_BYTES (25 MB cap, see main.py).
    client_max_body_size 30m;

    # --- API ---
    location /api/ {
        proxy_pass http://aglex_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- WebSocket (realtime) ---
    location /ws {
        proxy_pass http://aglex_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- MCP + OAuth 2.1 (docs/mcp/DESIGN.md) ---
    # Streamable HTTP endpoint for Claude / ChatGPT / Cursor connectors and
    # the OAuth authorization server endpoints the SDK serves at the root.
    # Without these blocks the SPA location below would swallow them.
    location = /mcp {
        proxy_pass http://aglex_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tool calls (codex embeddings, long documents) can take a while;
        # SSE responses must stream through unbuffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Secret-link connectors: the key is in the URL. Never log it (access or
    # error log), and hand it to the backend as a header on plain /mcp so no
    # URL downstream carries it.
    location ~ "^/mcp/k/(?<aglex_lk>aglx_lk_[A-Za-z0-9_-]{20,80})/?$" {
        access_log off;
        error_log /dev/null crit;
        proxy_set_header Authorization "Bearer $aglex_lk";
        # (no URI in proxy_pass inside a regex location — rewrite instead)
        rewrite ^ /mcp break;
        proxy_pass http://aglex_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/(authorize|token|register|revoke)$ {
        limit_req zone=aglex_oauth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://aglex_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth/ {
        limit_req zone=aglex_oauth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://aglex_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/oauth- {
        proxy_pass http://aglex_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA ---
    location / {
        proxy_pass http://aglex_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
